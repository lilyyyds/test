<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="685" viewBox="0 0 1080 685"><rect width="1080" height="685" rx="18" fill="#0b1424"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><text x="32" y="42" font-size="25" font-weight="700" fill="#e7eef7">GPIO budget | architecture-dependent, not absolute minima</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9bed1"/></marker></defs><text x="32" y="87" fill="#e7eef7" font-size="17" font-weight="600">Direct-wired reference</text><text x="32" y="109" fill="#a9bed1" font-size="12.8">8 TX + 8 digital RX + 13 ADC inputs (unfeasible on target MCUs)</text><rect x="600" y="68" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="68" width="343.8" height="28" rx="5" fill="#f5aa45"/><text x="1013" y="90" fill="#e7eef7" font-size="18" font-weight="700">36</text><text x="32" y="165" fill="#e7eef7" font-size="17" font-weight="600">Driver + SPI ADC + I2C ALS</text><text x="32" y="187" fill="#a9bed1" font-size="12.8">8 sector RX digital inputs retained (baseline)</text><rect x="600" y="146" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="146" width="219.64999999999998" height="28" rx="5" fill="#54c8b1"/><text x="1013" y="168" fill="#e7eef7" font-size="18" font-weight="700">23</text><text x="32" y="243" fill="#e7eef7" font-size="17" font-weight="600">Driver + SPI ADC + analog ALS</text><text x="32" y="265" fill="#a9bed1" font-size="12.8">4 ALS share 16-ch ADC; no I2C required</text><rect x="600" y="224" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="224" width="200.55" height="28" rx="5" fill="#4aa8e5"/><text x="1013" y="246" fill="#e7eef7" font-size="18" font-weight="700">21</text><text x="32" y="321" fill="#e7eef7" font-size="17" font-weight="600">8:1 digital RX mux + I2C ALS</text><text x="32" y="343" fill="#a9bed1" font-size="12.8">Only 1 selected RX waveform at a time</text><rect x="600" y="302" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="302" width="181.45" height="28" rx="5" fill="#4aa8e5"/><text x="1013" y="324" fill="#e7eef7" font-size="18" font-weight="700">19</text><text x="32" y="399" fill="#e7eef7" font-size="17" font-weight="600">Single merged RX data + I2C ALS</text><text x="32" y="421" fill="#a9bed1" font-size="12.8">Requires validated decoder; loses separate digital timing</text><rect x="600" y="380" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="380" width="152.8" height="28" rx="5" fill="#4aa8e5"/><text x="1013" y="402" fill="#e7eef7" font-size="18" font-weight="700">16</text><text x="32" y="477" fill="#e7eef7" font-size="17" font-weight="600">Merged RX data + analog ALS</text><text x="32" y="499" fill="#a9bed1" font-size="12.8">Experimental minimum, same decoding caveat</text><rect x="600" y="458" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="458" width="133.7" height="28" rx="5" fill="#4aa8e5"/><text x="1013" y="480" fill="#e7eef7" font-size="18" font-weight="700">14</text><text x="32" y="555" fill="#e7eef7" font-size="17" font-weight="600">Secondary MCU (main only)</text><text x="32" y="577" fill="#a9bed1" font-size="12.8">Not total PCB GPIO; second MCU carries IR pins</text><rect x="600" y="536" width="382" height="28" rx="5" fill="#23374b"/><rect x="600" y="536" width="95.5" height="28" rx="5" fill="#4aa8e5"/><text x="1013" y="558" fill="#e7eef7" font-size="18" font-weight="700">10</text><text x="34" y="659" fill="#a9bed1" font-size="13">Functional signals only; excludes SWD, clocks, boot straps, extra ADC conversion controls, encoders and PCB reserves.</text></svg>