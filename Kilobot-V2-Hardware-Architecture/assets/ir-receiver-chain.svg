<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="570" viewBox="0 0 1060 570"><rect width="1060" height="570" rx="18" fill="#0b1424"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><text x="32" y="42" font-size="25" font-weight="700" fill="#e7eef7">8-channel IR receiver | digital plus analog information</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9bed1"/></marker></defs><rect x="25" y="120" width="185" height="70" rx="11" fill="#f5aa45" fill-opacity=".12" stroke="#f5aa45" stroke-width="2"/><text x="117.5" y="147" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">8 photodiodes</text><text x="117.5" y="169" text-anchor="middle" font-size="12.5" fill="#a9bed1">Photocurrent per direction</text><rect x="250" y="120" width="195" height="70" rx="11" fill="#8c98b0" fill-opacity=".12" stroke="#8c98b0" stroke-width="2"/><text x="347.5" y="147" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">8 analog front-ends</text><text x="347.5" y="169" text-anchor="middle" font-size="12.5" fill="#a9bed1">TIA + filter / gain</text><path d="M210 155 L250 155" stroke="#a9bed1" stroke-width="2.4"  marker-end="url(#arr)"/><rect x="525" y="65" width="230" height="77" rx="11" fill="#4aa8e5" fill-opacity=".12" stroke="#4aa8e5" stroke-width="2"/><text x="640" y="92" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">8 comparators</text><text x="640" y="114" text-anchor="middle" font-size="12.5" fill="#a9bed1">Decoded pulse edges</text><rect x="525" y="241" width="230" height="77" rx="11" fill="#54c8b1" fill-opacity=".12" stroke="#54c8b1" stroke-width="2"/><text x="640" y="268" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">8 envelope circuits</text><text x="640" y="290" text-anchor="middle" font-size="12.5" fill="#a9bed1">Packet amplitude per sector</text><path d="M445 155 H478 V104 H525" fill="none" stroke="#4aa8e5" stroke-width="2.5" marker-end="url(#arr)"/><path d="M445 155 H478 V279 H525" fill="none" stroke="#54c8b1" stroke-width="2.5" marker-end="url(#arr)"/><rect x="823" y="65" width="215" height="77" rx="11" fill="#4aa8e5" fill-opacity=".12" stroke="#4aa8e5" stroke-width="2"/><text x="930.5" y="92" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">8 MCU digital inputs</text><text x="930.5" y="114" text-anchor="middle" font-size="12.5" fill="#a9bed1">Message and sector timing</text><rect x="823" y="241" width="215" height="77" rx="11" fill="#54c8b1" fill-opacity=".12" stroke="#54c8b1" stroke-width="2"/><text x="930.5" y="268" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">16-ch SPI ADC</text><text x="930.5" y="290" text-anchor="middle" font-size="12.5" fill="#a9bed1">8 amplitudes + optional ALS</text><path d="M755 104 L823 104" stroke="#4aa8e5" stroke-width="2.4"  marker-end="url(#arr)"/><path d="M755 279 L823 279" stroke="#54c8b1" stroke-width="2.4"  marker-end="url(#arr)"/><rect x="250" y="405" width="565" height="77" rx="11" fill="#8c98b0" fill-opacity=".12" stroke="#8c98b0" stroke-width="2"/><text x="532.5" y="432" font-size="16" text-anchor="middle" font-weight="700" fill="#e7eef7">Main MCU / packet processor</text><text x="532.5" y="454" text-anchor="middle" font-size="12.5" fill="#a9bed1">Decode ID + CRC; calibrate distance; estimate bearing</text><path d="M927 142V380H685V405 M927 318V380H595V405" fill="none" stroke="#a9bed1" stroke-width="2.5" marker-end="url(#arr)"/><text x="35" y="527" fill="#a9bed1" font-size="14">Do not merge raw photodiodes: preserve sector amplitude before any OR/digital aggregation.</text><text x="35" y="547" fill="#a9bed1" font-size="14">The 8 channel solution is provisional; envelope hold and time alignment must be verified.</text></svg>