<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550"><rect width="1080" height="550" rx="18" fill="#0b1424"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><text x="30" y="42" font-size="26" font-weight="700" fill="#eef5ff">Four ambient-light sensors | MCU interface options</text><rect x="25" y="80" width="505" height="199" rx="11" fill="#f5aa45" fill-opacity=".09" stroke="#f5aa45" stroke-width="1.8"/><text x="47" y="117" font-size="22" font-weight="700" fill="#eef5ff">A | Direct analog</text><text x="47" y="158" font-size="16" fill="#d5e6fa">4 analog ALS -> 4 MCU ADC</text><path d="M50 184H494" stroke="#f5aa45" stroke-width="3" stroke-dasharray="6 4"/><rect x="47" y="202" width="215" height="35" rx="6" fill="#f5aa45" fill-opacity=".2"/><text x="154" y="226" font-size="17" font-weight="600" fill="#eef5ff" text-anchor="middle">4 MCU ADC pins</text><text x="47" y="258" font-size="14" fill="#a9bed1">No expansion IC; consumes ADC inputs.</text><rect x="550" y="80" width="505" height="199" rx="11" fill="#4aa8e5" fill-opacity=".09" stroke="#4aa8e5" stroke-width="1.8"/><text x="572" y="117" font-size="22" font-weight="700" fill="#eef5ff">B | TMUX1204</text><text x="572" y="158" font-size="16" fill="#d5e6fa">4 analog ALS -> 4:1 MUX -> ADC</text><path d="M575 184H1019" stroke="#4aa8e5" stroke-width="3" stroke-dasharray="6 4"/><rect x="572" y="202" width="215" height="35" rx="6" fill="#4aa8e5" fill-opacity=".2"/><text x="679" y="226" font-size="17" font-weight="600" fill="#eef5ff" text-anchor="middle">1 ADC + 2 GPIO = 3</text><text x="572" y="258" font-size="14" fill="#a9bed1">Time-multiplexed, enabled in hardware.</text><rect x="25" y="303" width="505" height="199" rx="11" fill="#54c8b1" fill-opacity=".09" stroke="#54c8b1" stroke-width="1.8"/><text x="47" y="340" font-size="22" font-weight="700" fill="#eef5ff">C | OPT3001 x 4</text><text x="47" y="381" font-size="16" fill="#d5e6fa">4 digital ALS -> shared I2C</text><path d="M50 407H494" stroke="#54c8b1" stroke-width="3" stroke-dasharray="6 4"/><rect x="47" y="425" width="215" height="35" rx="6" fill="#54c8b1" fill-opacity=".2"/><text x="154" y="449" font-size="17" font-weight="600" fill="#eef5ff" text-anchor="middle">SDA + SCL = 2</text><text x="47" y="481" font-size="14" fill="#a9bed1">Four distinct addresses: 0x44-0x47.</text><rect x="550" y="303" width="505" height="199" rx="11" fill="#e0c46a" fill-opacity=".09" stroke="#e0c46a" stroke-width="1.8"/><text x="572" y="340" font-size="22" font-weight="700" fill="#eef5ff">D | Shared ADS7953</text><text x="572" y="381" font-size="16" fill="#d5e6fa">4 analog ALS -> spare ADC inputs</text><path d="M575 407H1019" stroke="#e0c46a" stroke-width="3" stroke-dasharray="6 4"/><rect x="572" y="425" width="215" height="35" rx="6" fill="#e0c46a" fill-opacity=".2"/><text x="679" y="449" font-size="17" font-weight="600" fill="#eef5ff" text-anchor="middle">0 extra MCU pins</text><text x="572" y="481" font-size="14" fill="#a9bed1">13/16 ADC channels incl IR + battery.</text><text x="26" y="528" font-size="14" fill="#a9bed1">Pin accounting refers only to ambient sensing; shared SPI or I2C buses are counted once system-wide.</text></svg>